name: Build bootstrap archives

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Comma-separated architectures to build
        type: string
        required: true
        default: aarch64

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check source downloader
        run: |
          bash -n scripts/generate-bootstraps.sh

      - name: Configure package repository URL
        id: configure
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
        run: |
          if [[ -z "$R2_PUBLIC_URL" ]]; then
            echo "::error::Set R2_PUBLIC_URL before generating the bootstrap."
            exit 1
          fi
          echo "repository=${R2_PUBLIC_URL%/}/apt/termux-main" >> "$GITHUB_OUTPUT"

      - name: Generate bootstrap archives from the published package repository
        id: generate
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          REPOSITORY: ${{ steps.configure.outputs.repository }}
        run: |
          for arch in ${ARCHITECTURES//,/ }; do
            curl --fail --location --silent --show-error --max-time 30 \
              --output /dev/null \
              "$REPOSITORY/dists/stable/main/binary-${arch}/Packages" \
              || { echo "::error::Sparrow APT index is missing for ${arch}: $REPOSITORY"; exit 1; }
          done
          ./scripts/generate-bootstraps.sh \
            --architectures "$ARCHITECTURES" \
            --repository "$REPOSITORY"

      - name: Store bootstrap archives
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-${{ github.run_id }}
          path: bootstrap-*.zip
          if-no-files-found: error

      - name: Publish bootstrap to R2
        if: vars.R2_ENDPOINT != '' && vars.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; bootstrap was saved only as an Actions artifact."
            exit 0
          fi
          for archive in bootstrap-*.zip; do
            arch="${archive#bootstrap-}"
            arch="${arch%.zip}"
            sha256sum "$archive" > "$archive.sha256"
            aws s3 cp "$archive" "s3://${R2_BUCKET}/bootstrap/$arch/$archive" \
              --endpoint-url "$R2_ENDPOINT" --region auto
            aws s3 cp "$archive.sha256" "s3://${R2_BUCKET}/bootstrap/$arch/$archive.sha256" \
              --endpoint-url "$R2_ENDPOINT" --region auto
          done

      - name: Publish bootstrap to the Sparrow pool release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view pool -R "$GH_REPO" --json id >/dev/null 2>&1 \
            || gh release create pool -R "$GH_REPO" \
              --title "Sparrow package pool" --notes "Rolling package and bootstrap assets"
          for archive in bootstrap-*.zip; do
            sha256sum "$archive" > "$archive.sha256"
          done
          gh release upload pool -R "$GH_REPO" --clobber \
            bootstrap-*.zip bootstrap-*.zip.sha256
