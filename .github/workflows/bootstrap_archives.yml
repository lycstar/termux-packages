name: Build bootstrap archives

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Comma-separated architectures to build
        type: string
        required: true
        default: aarch64,arm,i686,x86_64
      additional-packages:
        description: Optional comma-separated packages to add to the bootstrap
        type: string
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Build bootstrap archives from fork packages
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          ADDITIONAL_PACKAGES: ${{ inputs['additional-packages'] }}
        run: |
          args=(--architectures "$ARCHITECTURES")
          if [[ -n "$ADDITIONAL_PACKAGES" ]]; then
            args+=(--add "$ADDITIONAL_PACKAGES")
          fi
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${args[@]}"

      - name: Store bootstrap archives
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-${{ github.run_id }}
          path: bootstrap-*.zip
          if-no-files-found: error
