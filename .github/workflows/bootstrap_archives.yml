name: Generate bootstrap archives (android-7)

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      architectures:
        description: Comma-separated architectures to build
        type: string
        required: false
        default: aarch64

permissions: {} # none

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read # actions/upload-artifact doesn't need contents: write
    runs-on: ubuntu-slim
    strategy:
      matrix:
        arch: [aarch64]
    steps:
      - name: Git clone
        uses: actions/checkout@v7
      - name: Create bootstrap archive
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          ARCHITECTURES: ${{ inputs.architectures || matrix.arch }}
        run: |
          repository="${R2_PUBLIC_URL%/}/apt/termux-main"
          if [[ -z "$R2_PUBLIC_URL" ]]; then
            repository="https://packages-cf.termux.dev/apt/termux-main"
          fi
          ./scripts/generate-bootstraps.sh \
            --architectures "$ARCHITECTURES" \
            --repository "$repository"
      - name: Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-${{ github.run_id }}-${{ matrix.arch }}
          path: "bootstrap-*.zip"
  publish:
    permissions:
      contents: write # for git push
    needs: build
    runs-on: ubuntu-slim
    steps:
      - name: Git clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Fetch bootstrap archives
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: ./
      - name: Create new tag
        id: get_tag
        run: |
          new_tag="bootstrap-$(date "+%Y.%m.%d")"
          existing_tag_revision=$(git tag | grep "$new_tag" | sort -r | head -n 1 | cut -d- -f3 | cut -dr -f2)
          if [ -n "$existing_tag_revision" ]; then
            tag_rev=$((existing_tag_revision + 1))
          else
            tag_rev=1
          fi
          new_tag="${new_tag}-r${tag_rev}+apt.android-7"
          echo "tag_name=$new_tag" >> $GITHUB_OUTPUT
      - name: Publish bootstrap zips to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ steps.get_tag.outputs.tag_name }} --title "Bootstrap archives for Termux application (apt.android-7)"
          for file in *.zip; do
            gh release upload ${{ steps.get_tag.outputs.tag_name }} "$file"
          done
      - name: Mirror bootstrap zips to R2
        if: vars.R2_ENDPOINT != '' && vars.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          for file in *.zip; do
            arch="${file#bootstrap-}"
            arch="${arch%.zip}"
            sha256sum "$file" > "$file.sha256"
            aws s3 cp "$file" "s3://${R2_BUCKET}/bootstrap/${arch}/${file}" \
              --endpoint-url "$R2_ENDPOINT" --region auto
            aws s3 cp "$file.sha256" "s3://${R2_BUCKET}/bootstrap/${arch}/${file}.sha256" \
              --endpoint-url "$R2_ENDPOINT" --region auto
          done
