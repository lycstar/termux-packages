            "https://github.com/libusb/libusb/releases/download/v1.0.30/libusb-1.0.30.tar.bz2" \
            "https://github.com/lycstar/termux-packages/releases/download/pool/libusb-1.0.30.tar.bz2"
          seed pinentry-1.3.3.tar.bz2 c2970f16d6afb66ecddfca767d743936c86239bff936eed7fd7597a678414b63 \
            "https://www.gnupg.org/ftp/gcrypt/pinentry/pinentry-1.3.3.tar.bz2" \
            "https://github.com/lycstar/termux-packages/releases/download/pool/pinentry-1.3.3.tar.bz2"
          seed v1.10.0.tar.gz 537512904744b35e232912055ccf8ec66d768639ff3abe5788d90d792ec5f48b \
            "https://github.com/lz4/lz4/archive/refs/tags/v1.10.0.tar.gz" \
            "https://github.com/lycstar/termux-packages/releases/download/pool/v1.10.0.tar.gz"
          seed v0.8.4.tar.gz 5738270935e7c3d38a79b3adf7c9692566ce7895a25f67de43ad52ab504acd32 \
            "https://github.com/Cyan4973/xxHash/archive/refs/tags/v0.8.4.tar.gz" \
            "https://github.com/lycstar/termux-packages/releases/download/pool/v0.8.4.tar.gz"

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Build bootstrap archives from fork packages
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: >-
            --env TERMUX_SOURCE_CACHE_DIR=/home/builder/termux-packages/output/.source-cache
            --env TERMUX_SOURCE_MIRRORS=${{ steps.configure.outputs.mirror-url }}
        run: |
          args=(--architectures "$ARCHITECTURES")
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${args[@]}"

      - name: Save verified source cache even after build failure
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: output/.source-cache
          key: source-archives-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Store bootstrap archives
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-${{ github.run_id }}
          path: output/bootstrap-*.zip
          if-no-files-found: error

      - name: Publish bootstrap to R2
        if: vars.R2_ENDPOINT != '' && vars.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; bootstrap was saved only as an Actions artifact."
            exit 0
          fi
          for archive in output/bootstrap-*.zip; do
            name="$(basename "$archive")"
            arch="${name#bootstrap-}"
            arch="${arch%.zip}"
            sha256sum "$archive" > "${name}.sha256"
            aws s3 cp "$archive" "s3://${R2_BUCKET}/bootstrap/$arch/$name" \
              --endpoint-url "$R2_ENDPOINT" --region auto
            aws s3 cp "${name}.sha256" "s3://${R2_BUCKET}/bootstrap/$arch/${name}.sha256" \
              --endpoint-url "$R2_ENDPOINT" --region auto
          done
