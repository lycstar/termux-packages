name: Build bootstrap archives

on:
  workflow_dispatch:
    inputs:
      architectures:
        description: Comma-separated architectures to build
        type: string
        required: true
        default: aarch64

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-26.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check source downloader
        run: |
          bash -n scripts/build/termux_download.sh scripts/build/termux_source_mirrors.sh scripts/build-bootstraps.sh
          python3 -m unittest discover -s scripts/tests -p 'test_source_download.py' -v

      - name: Restore verified source cache
        uses: actions/cache/restore@v4
        with:
          path: .source-cache
          key: source-archives-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            source-archives-v1-

      # actions/cache restores files owned by the runner uid, but the build
      # container writes as uid 1000 (builder) — without this, .source-cache
      # mkdir fails with Permission denied and the cache is never populated.
      - name: Prepare source cache for the builder container
        run: |
          mkdir -p .source-cache
          sudo chmod 1777 .source-cache

      - name: Configure package repository URL
        id: configure
        env:
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          mirror_url=""
          if [[ -n "$R2_ENDPOINT$R2_BUCKET" && -z "$R2_PUBLIC_URL" ]]; then
            echo "::error::Set R2_PUBLIC_URL before building bootstrap for R2."
            exit 1
          fi
          if [[ -n "$R2_PUBLIC_URL" ]]; then
            base="${R2_PUBLIC_URL%/}"
            # 私有源镜像(按 sha256 寻址): 与 APT 同桶的另一前缀
            mirror_url="${base%/*}/termux-mirror"
            # bootstrap 只含 termux-main 的包; 删掉 x11/root 条目, 否则
            # command-not-found 的 generate-db.js 会去请求不存在的源而 404
            jq --arg main "$base/apt/termux-main" \
              '.packages.url = $main | del(.["root-packages"]) | del(.["x11-packages"])' \
              repo.json > repo.json.tmp
            mv repo.json.tmp repo.json
          fi
          echo "mirror-url=$mirror_url" >> "$GITHUB_OUTPUT"

      - name: Seed private source mirror
        if: ${{ steps.configure.outputs.mirror-url != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          MIRROR_URL: ${{ steps.configure.outputs.mirror-url }}
        run: |
          # 上游源(docbook.org 等)对 CI 间歇抽风; 首次从公共镜像取得后
          # 按 sha256 播种进 R2, termux_download 之后会自动回退到这里。
          seed() {
            local name="$1" sha="$2"; shift 2
            local src tmp code
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 -L "$MIRROR_URL/sha256/$sha") || true
            [[ "$code" == 200 ]] && { echo "mirror already has $name"; return 0; }
            tmp=$(mktemp)
            for src in "$@"; do
              curl -sL --max-time 120 -o "$tmp" "$src" || continue
              [[ "$(sha256sum "$tmp" | cut -d' ' -f1)" == "$sha" ]] || continue
              aws s3 cp "$tmp" "s3://${R2_BUCKET}/termux-mirror/sha256/$sha" \
                --endpoint-url "$R2_ENDPOINT" --region auto
              echo "seeded $name ($sha)"
              rm -f "$tmp"
              return 0
            done
            rm -f "$tmp"
            echo "::warning::could not seed $name"
          }
          seed docbkx412.zip 30f0644064e0ea71751438251940b1431f46acada814a062870f486c772e7772 \
            "https://archive.docbook.org/xml/4.1.2/docbkx412.zip" \
            "https://distfiles.macports.org/docbook-xml/docbkx412.zip"
          seed keyutil-0.4.0.jar 18f1d2c82839d84949b1ad015343c509e81ef678c24db6112acc6c0761314610 \
            "https://github.com/use-sparingly/keyutil/releases/download/0.4.0/keyutil-0.4.0.jar" \
            "https://gh-proxy.com/https://github.com/use-sparingly/keyutil/releases/download/0.4.0/keyutil-0.4.0.jar"
          seed tcl8.6.16-src.tar.gz 91cb8fa61771c63c262efb553059b7c7ad6757afa5857af6265e4b0bdc2a14a5 \
            "https://downloads.sourceforge.net/project/tcl/Tcl/8.6.16/tcl8.6.16-src.tar.gz" \
            "https://distfiles.macports.org/tcl/tcl8.6.16-src.tar.gz"

      - name: Enable zram
        uses: ./.github/actions/zram
        with:
          algorithm: zstd
          size: 16G
          priority: 100
          device_name: /dev/zram0

      - name: Build bootstrap archives from fork packages
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          TERMUX_DOCKER_EXEC_EXTRA_ARGS: >-
            --env TERMUX_SOURCE_CACHE_DIR=/home/builder/termux-packages/.source-cache
            --env TERMUX_SOURCE_MIRRORS=${{ steps.configure.outputs.mirror-url }}
        run: |
          args=(--architectures "$ARCHITECTURES")
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh "${args[@]}"

      - name: Save verified source cache even after build failure
        if: ${{ always() && !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: .source-cache
          key: source-archives-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Store bootstrap archives
        uses: actions/upload-artifact@v7
        with:
          name: bootstrap-archives-${{ github.run_id }}
          path: bootstrap-*.zip
          if-no-files-found: error

      - name: Publish bootstrap to R2
        if: vars.R2_ENDPOINT != '' && vars.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::warning::R2 credentials are not configured; bootstrap was saved only as an Actions artifact."
            exit 0
          fi
          for archive in bootstrap-*.zip; do
            arch="${archive#bootstrap-}"
            arch="${arch%.zip}"
            sha256sum "$archive" > "$archive.sha256"
            aws s3 cp "$archive" "s3://${R2_BUCKET}/bootstrap/$arch/$archive" \
              --endpoint-url "$R2_ENDPOINT" --region auto
            aws s3 cp "$archive.sha256" "s3://${R2_BUCKET}/bootstrap/$arch/$archive.sha256" \
              --endpoint-url "$R2_ENDPOINT" --region auto
          done
