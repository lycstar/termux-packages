name: Republish bootstrap to R2

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Bootstrap run id whose artifact should be republished"
        required: true
      architectures:
        description: "Architectures contained in the artifact"
        required: true
        default: aarch64

permissions:
  contents: read

jobs:
  republish:
    runs-on: ubuntu-26.04
    steps:
      - name: Download bootstrap artifact
        uses: actions/download-artifact@v8
        with:
          name: bootstrap-archives-${{ inputs.run_id }}
          run-id: ${{ inputs.run_id }}
          path: output
          github-token: ${{ github.token }}

      - name: Publish to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          ls -l output/
          for archive in output/bootstrap-*.zip; do
            name="$(basename "$archive")"
            arch="${name#bootstrap-}"
            arch="${arch%.zip}"
            sha256sum "$archive" > "${name}.sha256"
            aws s3 cp "$archive" "s3://${R2_BUCKET}/bootstrap/$arch/$name" \
              --endpoint-url "$R2_ENDPOINT" --region auto
            aws s3 cp "${name}.sha256" "s3://${R2_BUCKET}/bootstrap/$arch/${name}.sha256" \
              --endpoint-url "$R2_ENDPOINT" --region auto
          done
